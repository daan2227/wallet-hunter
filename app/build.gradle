plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
android {
    namespace 'com.btcseedrecovery'
    compileSdk 34
    buildFeatures { prefab true }
    defaultConfig {
        ndk {
            abiFilters "arm64-v8a"
        }
        applicationId "com.btcseedrecovery"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -O3"
                cFlags "-O3 -D_FILE_OFFSET_BITS=64"
                arguments "-DANDROID_STL=c++_shared"
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }
    // Firma de release. El keystore real nunca se versiona: el workflow lo
    // materializa desde el secret RELEASE_KEYSTORE_B64 en app/release.keystore.
    // Si no está presente (build local, o secrets aún sin configurar) se cae al
    // debug.keystore para no romper la compilación — pero un APK firmado así NO
    // es publicable: Google Play rechaza la clave de debug y su contraseña es
    // pública, así que cualquiera podría firmar una actualización falsa.
    signingConfigs {
        release {
            def ksFile = file("release.keystore")
            if (ksFile.exists()) {
                storeFile     ksFile
                storePassword System.getenv("RELEASE_STORE_PASSWORD")
                keyAlias      System.getenv("RELEASE_KEY_ALIAS")
                keyPassword   System.getenv("RELEASE_KEY_PASSWORD")
            } else {
                logger.warn("WARNING: release.keystore missing — signing with the " +
                            "debug key. This APK is NOT publishable to Google Play.")
                storeFile     file("debug.keystore")
                storePassword "android"
                keyAlias      "androiddebugkey"
                keyPassword   "android"
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                          'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            minifyEnabled false
        }
    }
}
dependencies {
    implementation 'com.android.ndk.thirdparty:openssl:1.1.1l-beta-1'
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    // implementation 'com.google.android.gms:play-services-ads:23.0.0'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'com.google.zxing:core:3.5.2'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    implementation 'androidx.biometric:biometric:1.2.0-alpha05'
}
