plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
android {
    namespace 'com.hunter.btc'
    compileSdk 34
    buildFeatures { prefab true }
    defaultConfig {
        ndk {
            abiFilters "arm64-v8a"
        }
        applicationId "com.hunter.btc"
        // resources.arsc ocupaba 1,15 MB en el APK, casi todo traducciones de
        // AppCompat a ~80 idiomas que la app no ofrece: su interfaz está en
        // español con algunas cadenas en inglés, nada más.
        resourceConfigurations += ["en", "es"]
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -O3"
                cFlags "-O3 -D_FILE_OFFSET_BITS=64"
                arguments "-DANDROID_STL=c++_shared"
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }
    // Firma de release. El keystore real nunca se versiona: el workflow lo
    // materializa desde el secret RELEASE_KEYSTORE_B64 en app/release.keystore.
    // Si no está (build local, o secrets sin configurar) se cae al debug.keystore
    // para no romper la compilación, pero ese APK NO es publicable: la contraseña
    // de la clave de debug es pública, así que cualquiera podría firmar una
    // actualización que el sistema aceptaría como legítima.
    signingConfigs {
        release {
            def ksFile = file("release.keystore")
            if (ksFile.exists()) {
                storeFile     ksFile
                storePassword System.getenv("RELEASE_STORE_PASSWORD")
                keyAlias      System.getenv("RELEASE_KEY_ALIAS")
                keyPassword   System.getenv("RELEASE_KEY_PASSWORD")
            } else {
                logger.warn("WARNING: release.keystore missing — signing with the " +
                            "debug key. This APK is NOT publishable.")
                storeFile     file("debug.keystore")
                storePassword "android"
                keyAlias      "androiddebugkey"
                keyPassword   "android"
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
        }
        debug {
            minifyEnabled false
        }
    }
}
dependencies {
    implementation 'com.android.ndk.thirdparty:openssl:1.1.1l-beta-1'
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    // Sólo se genera el QR (QRCodeWriter); la matriz se pinta a mano en
    // WalletActivity. zxing-android-embedded traía además toda la interfaz de
    // escaneo por cámara, sin un solo uso en la app.
    implementation 'com.google.zxing:core:3.5.2'
    implementation 'androidx.biometric:biometric:1.2.0-alpha05'

    /* Retiradas por no usarse:
       - com.google.android.material: el tema es Theme.AppCompat.NoActionBar y
         no hay ni una vista Material en código ni en res/.
       - androidx.security:security-crypto: arrastra Tink entero. El cifrado va
         directo contra el Keystore y Cipher, sin EncryptedSharedPreferences.
       - com.journeyapps:zxing-android-embedded: ver arriba. */
}
