name: Build APK
on:
  push:
    branches: [ main, claude/** ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        # Historia entera: el paso siguiente compara con el commit anterior
        # para saber si hace falta pasar los bancos. El repositorio es pequeño.
        fetch-depth: 0
        # Sin dejar el token (con permiso de escritura) en .git/config: ahí lo
        # podía leer cualquier paso, incluido código de terceros (Gradle, apt,
        # scripts). Sólo "Publish APK" lo necesita, y lo recibe por GH_TOKEN.
        persist-credentials: false

    # ¿Toca este push el motor o sus pruebas?
    #
    # Los dos bancos se llevan unos 2,5 de los ~5,5 minutos de la compilación,
    # y la mayoría de los commits son de pantallas, que no pueden romper el
    # motor. Se pasan si cambia algo de app/src/main/cpp/ (el motor, la GPU),
    # de tools/ec-harness/ (las pruebas) o este mismo fichero. Ante la duda
    # —primer push de una rama, commit anterior que no está, lanzado a mano—
    # se pasan: saltarse una prueba que tocaba es peor que perder dos minutos.
    - name: ¿Toca el motor?
      id: motor
      run: |
        ANTES="${{ github.event.before }}"
        if [ "${{ github.event_name }}" != "push" ] || [ -z "$ANTES" ] \
           || [ "$ANTES" = "0000000000000000000000000000000000000000" ] \
           || ! git cat-file -e "$ANTES^{commit}" 2>/dev/null; then
          echo "cambia=1" >> "$GITHUB_OUTPUT"; echo "arm=1" >> "$GITHUB_OUTPUT"
          echo "gpu=1" >> "$GITHUB_OUTPUT"; echo "lattice=1" >> "$GITHUB_OUTPUT"
          echo "Sin commit anterior: se pasan los bancos."; exit 0
        fi
        CAMBIOS=$(git diff --name-only "$ANTES" "${{ github.sha }}")
        # El banco ARM64 (qemu) cuesta instalar un compilador cruzado: solo
        # cuando cambia algo que tiene codigo propio de ARM64.
        if echo "$CAMBIOS" | grep -qE '(sha512|fe_arm64|jac_batch|restasuma|sha256_ripemd160|sha256_hw|hash160x4|escaner_raw|pbkdf2|arm64\.sh|build\.yml)'; then
          echo "arm=1" >> "$GITHUB_OUTPUT"
        else
          echo "arm=0" >> "$GITHUB_OUTPUT"
        fi
        if echo "$CAMBIOS" | grep -qE '^(app/src/main/cpp/|tools/ec-harness/|\.github/workflows/)'; then
          echo "cambia=1" >> "$GITHUB_OUTPUT"; echo "Toca el motor o sus pruebas: se pasan los bancos."
        else
          echo "cambia=0" >> "$GITHUB_OUTPUT"; echo "No toca el motor: se saltan los bancos."
        fi
        # La GPU sólo cuando cambia su código, o el kangaroo.h que incluye su
        # banco. Un cambio de pantallas no la despierta.
        if echo "$CAMBIOS" | grep -qE '(app/src/main/cpp/gpu/|app/src/main/cpp/kangaroo\.h|app/src/main/cpp/jac_batch\.h|tools/ec-harness/gpu_kangaroo|\.github/workflows/build\.yml)'; then
          echo "gpu=1" >> "$GITHUB_OUTPUT"
        else
          echo "gpu=0" >> "$GITHUB_OUTPUT"
        fi
        # La reticula es Python y valida el algoritmo que usa Lattice.kt: sólo
        # se lanza si cambia ese código o su validador.
        if echo "$CAMBIOS" | grep -qE '(app/src/main/java/|app/src/test/|tools/ec-harness/lattice_hnp\.py|\.github/workflows/build\.yml)'; then
          echo "lattice=1" >> "$GITHUB_OUTPUT"
        else
          echo "lattice=0" >> "$GITHUB_OUTPUT"
        fi

    # El banco de pruebas, ANTES de compilar nada.
    #
    # Compila las cabeceras REALES del motor (kangaroo.h, ec.h) como binarios de
    # escritorio y las pone a prueba: logaritmos discretos con la respuesta
    # conocida, la invariante de que un canguro está donde dice su distancia, el
    # coste en raíces de W con un techo, el ida y vuelta de la tabla por disco y
    # por red. Tarda un minuto.
    #
    # Estaba escrito y no lo ejecutaba nadie más que yo a mano, o sea que no
    # vigilaba nada entre sesiones. Y lo que hay que vigilar es justo lo que se
    # coló así: la tabla de saltos guardaba el salto 63 como cero, el motor no
    # podía encontrar nada en el #140 y compilaba en verde igual.
    #
    # Va primero a propósito. Si el motor está roto esto falla en un minuto, en
    # vez de después de cruzar Go y montar el APK entero — que con los minutos
    # contados de un repositorio privado es la diferencia entre poder seguir
    # compilando y no.
    - name: Banco de pruebas del motor
      if: steps.motor.outputs.cambia == '1'
      run: |
        # reparto mide PBKDF2 y direcciones usa el hash, los dos con OpenSSL.
        # La imagen de ubuntu lo trae, pero si algun dia dejara de traerlo esto
        # tumbaria la compilacion entera por una cabecera que falta.
        sudo apt-get install -y libssl-dev 2>/dev/null || true
        tools/ec-harness/run.sh

    # Reticula (HNP + LLL): recupera la clave de 18 de 18 firmas con nonces
    # cortos. Va aparte del banco del motor para que cambiar Lattice.kt lo
    # active aunque no toque el motor. Python puro, unos 7 s.
    - name: Banco de la reticula (HNP + LLL)
      if: steps.motor.outputs.lattice == '1'
      run: python3 -I tools/ec-harness/lattice_hnp.py

    # Kangaroo en la GPU, con Vulkan por software (lavapipe): comprueba que
    # cada punto distinguido que devuelve el shader esta donde dice su
    # distancia y que resuelve claves conocidas SOLO con la GPU. El ritmo de
    # aqui no dice nada del movil; la exactitud si.
    - name: Banco de la GPU (Vulkan por software)
      if: steps.motor.outputs.gpu == '1'
      run: |
        sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan-dev > /dev/null
        cd tools/ec-harness
        g++ -O2 -o gpu_kangaroo gpu_kangaroo.cpp -lvulkan -lpthread
        ./gpu_kangaroo

    # fe_mul en ensamblador y SHA-256/SHA-512 con las instrucciones del
    # procesador: la CI es x86, asi que con qemu. Tambien que un procesador SIN
    # SHA-512 se quede en software en vez de cerrarse la app.
    - name: Banco ARM64 (qemu)
      if: steps.motor.outputs.arm == '1'
      run: |
        sudo apt-get install -y --no-install-recommends g++-aarch64-linux-gnu qemu-user > /dev/null
        tools/ec-harness/arm64.sh

    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # El NDK pesa ~1 GB y su descarga ha fallado a veces sin motivo (un
    # sdkmanager que se corta). Se cachea por versión: en las compilaciones
    # siguientes no se vuelve a bajar nada.
    - name: Ruta del SDK de Android
      id: sdk
      run: echo "ruta=$ANDROID_SDK_ROOT" >> "$GITHUB_OUTPUT"

    - name: Caché del NDK y CMake
      id: ndk-cache
      uses: actions/cache@v4
      with:
        path: |
          ${{ steps.sdk.outputs.ruta }}/ndk/25.1.8937393
          ${{ steps.sdk.outputs.ruta }}/cmake/3.22.1
        key: ndk-25.1.8937393-cmake-3.22.1

    - name: Install NDK
      if: steps.ndk-cache.outputs.cache-hit != 'true'
      run: |
        echo "y" | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
          "ndk;25.1.8937393" "cmake;3.22.1"

    # Versión FIJA de secp256k1, comprobada por su commit. Antes se clonaba
    # master tal cual: el APK, que deriva claves y firma, llevaba el código
    # que hubiera ese día en upstream, y dos compilaciones del mismo commit
    # podían salir con criptografía distinta. Para subir de versión se cambian
    # las dos líneas a la vez (etiqueta y su commit).
    - name: Clone and configure secp256k1
      env:
        SECP_TAG: v0.8.0
        SECP_COMMIT: 6e2c8bc4ecdc6e71dbe7a368f360d8d453ce435d
      run: |
        cd app/src/main/cpp
        git clone --depth=1 --branch "$SECP_TAG" https://github.com/bitcoin-core/secp256k1.git
        cd secp256k1
        test "$(git rev-parse HEAD)" = "$SECP_COMMIT" || { echo "::error::secp256k1 $SECP_TAG is not commit $SECP_COMMIT"; exit 1; }
        echo "=== Checking precomputed files ==="
        ls src/precomputed_ecmult.c 2>/dev/null && echo "OK precomputed_ecmult.c" || echo "MISSING precomputed_ecmult.c"
        ls src/precomputed_ecmult_gen.c 2>/dev/null && echo "OK precomputed_ecmult_gen.c" || echo "MISSING precomputed_ecmult_gen.c"
        # Generar tablas si faltan
        if [ ! -f "src/precomputed_ecmult.c" ]; then
          echo "Generating precomputed tables..."
          sudo apt-get install -y gcc make 2>/dev/null || true
          gcc -o gen_precomputed_ecmult             src/gen_ecmult_static_pre_g.c             -I. -Isrc             -DSECP256K1_BUILD             -DUSE_FIELD_5x52             -DUSE_SCALAR_4x64 2>/dev/null || true
          ./gen_precomputed_ecmult > src/precomputed_ecmult.c 2>/dev/null || true
        fi

    # Lo que necesita el secp256k1 que se acaba de clonar: la recuperacion de
    # frases entera (PBKDF2, BIP32, direcciones) contra frases y direcciones
    # conocidas, y el escaner de claves (cada clave publica que prueba es la de
    # la privada que guardaria si coincidiera).
    - name: Banco de la recuperacion y el escaner
      if: steps.motor.outputs.cambia == '1'
      run: tools/ec-harness/con_secp.sh app/src/main/cpp/secp256k1

    # Bip39Words.kt ya NO se genera aquí: se descargaba de master de otro
    # repositorio, sin comprobar nada, y sustituía a la lista revisada. Una
    # palabra cambiada y la app generaría semillas que ninguna otra cartera
    # restaura. Va la del repositorio, cuyo SHA-256 es el de english.txt (lo
    # comprueba Bip39WordsTest).

    # Firma SIEMPRE con la clave de publicación (secret RELEASE_KEYSTORE_B64).
    #
    # Antes, sin el secret, se firmaba con una clave de respaldo guardada en la
    # caché de Actions: la leía cualquier paso de la compilación, y caducaba a
    # los 7 días sin compilar — y entonces el siguiente APK salía con otra clave
    # y no se podía instalar encima (desinstalar borra baúl, carteras y PIN).
    # El secret existe, así que ya no hace falta ningún respaldo: si faltara,
    # la compilación falla en vez de publicar un APK firmado con otra clave.
    - name: Restore signing keystore
      env:
        KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
      run: |
        if [ -z "$KEYSTORE_B64" ]; then
          echo "::error::RELEASE_KEYSTORE_B64 is not set: refusing to build an APK signed with another key."
          exit 1
        fi
        echo "$KEYSTORE_B64" | base64 -d > app/release.keystore
        echo "Using release keystore from secrets."

    # Pruebas JVM de Lattice.kt (el ataque de retícula de verdad, no su
    # réplica en Python): firmas fabricadas con una clave conocida. Sólo corre
    # cuando cambia Lattice.kt o sus pruebas.
    - name: Pruebas JVM (reticula, sobre de semillas, contraseñas)
      if: steps.motor.outputs.lattice == '1'
      run: |
        chmod +x gradlew
        ./gradlew :app:testDebugUnitTest

    # Bitcoin Core para la pestaña «Core». Lo compila core.yml aparte (tarda más de una hora) y lo
    # deja en la release «core-android». Si todavía no existe, el APK sale igual y la pestaña dice
    # que esta versión no lo incluye.
    - name: Bitcoin Core (binario de core.yml)
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        mkdir -p app/src/main/jniLibs/arm64-v8a core-dl
        if gh release download core-android -p 'libbitcoind.so*' -D core-dl 2>/dev/null; then
          (cd core-dl && sha256sum -c libbitcoind.so.sha256)
          cp core-dl/libbitcoind.so app/src/main/jniLibs/arm64-v8a/libbitcoind.so
          ls -l app/src/main/jniLibs/arm64-v8a/libbitcoind.so
        else
          echo "No hay binario de Core todavía: el APK sale sin él."
        fi

    - name: Build Release APK
      env:
        RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
        RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      run: |
        chmod +x gradlew
        ./gradlew assembleRelease

    # Deja el desglose en el log del build, para no tener que descargar el APK
    # y abrirlo a mano cada vez que se quiera saber qué ocupa qué.
    - name: APK size breakdown
      run: |
        APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
        echo "APK: $(du -h "$APK" | cut -f1)"
        python3 - "$APK" <<'EOF'
        import zipfile, sys, collections
        z = zipfile.ZipFile(sys.argv[1])
        infos = z.infolist()
        total = sum(i.compress_size for i in infos)
        print("comprimido: %.2f MB en %d entradas\n" % (total/1048576, len(infos)))
        print("-- 10 mayores --")
        for i in sorted(infos, key=lambda x: -x.compress_size)[:10]:
            print("  %7.2f MB  %s" % (i.compress_size/1048576, i.filename))
        cat = collections.Counter()
        for i in infos:
            n = i.filename
            k = ('lib/ nativo' if n.startswith('lib/') else
                 'dex' if n.endswith('.dex') else
                 'resources.arsc' if n == 'resources.arsc' else
                 'res/' if n.startswith('res/') else
                 'assets/' if n.startswith('assets/') else 'otros')
            cat[k] += i.compress_size
        print("\n-- por categoria --")
        for k, v in cat.most_common():
            print("  %7.2f MB  %5.1f%%  %s" % (v/1048576, v*100/total, k))
        EOF

    # Cada rama publica bajo su propio tag.
    #
    # "latest-build" pertenece a playstore/seed-recovery. Y desde que main
    # recibió el merge de la rama full, ambas construían y publicaban bajo
    # "latest-build-full": dos ejecuciones borrando y recreando el mismo release
    # a la vez, que es como se perdió el APK de f4b2be0 —"a release with the same
    # tag name already exists"— aunque el build fuese correcto.
    - name: Publish APK
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        if [ "${{ github.ref_name }}" = "main" ]; then
          TAG=latest-build-main
          TITLE="Full build · main"
        else
          TAG=latest-build-full
          TITLE="Full build (hunting)"
        fi

        # Crear-o-actualizar en vez de borrar-y-crear: sin borrar el tag no hay
        # ventana en la que otra ejecución lo encuentre a medias, y reintentar
        # es inofensivo.
        gh release view "$TAG" >/dev/null 2>&1 || \
          gh release create "$TAG" \
            --title "$TITLE $(date +%Y-%m-%d)" \
            --notes "Auto-build from commit ${{ github.sha }} (${{ github.ref_name }}). Full app including hunting features — NOT the Play Store build." \
            --prerelease

        gh release edit "$TAG" \
          --title "$TITLE $(date +%Y-%m-%d)" \
          --notes "Auto-build from commit ${{ github.sha }} (${{ github.ref_name }}). Full app including hunting features — NOT the Play Store build."

        # --clobber reemplaza el APK anterior conservando el release y el tag.
        gh release upload "$TAG" app/build/outputs/apk/release/*.apk --clobber

        # version.json: lo que consulta el actualizador de la app (Actualizador.kt).
        # Se sube DESPUÉS del APK: si se cortara entre medias, la app vería la
        # versión vieja junto al APK nuevo y no ofrecería nada; al revés, una
        # versión nueva con el APK viejo, y la suma no cuadraría.
        if [ "$TAG" = "latest-build-main" ]; then
          APK=app/build/outputs/apk/release/app-release.apk
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          BYTES=$(stat -c %s "$APK")
          printf '{"versionCode":%s,"versionName":"1.0.%s","sha256":"%s","size":%s,"commit":"%s"}\n' \
            "${{ github.run_number }}" "${{ github.run_number }}" "$SHA" "$BYTES" "${{ github.sha }}" > version.json
          cat version.json
          gh release upload "$TAG" version.json --clobber
        fi
