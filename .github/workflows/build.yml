name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Install NDK
      run: |
        echo "y" | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
          "ndk;25.2.9519653" "cmake;3.22.1"
    - name: Clone secp256k1
      run: |
        cd app/src/main/cpp
        git clone --depth=1 https://github.com/bitcoin-core/secp256k1.git
    - name: Generate Bip39Words.kt multi-language
      run: python3 scripts/gen_bip39.py
    - name: Subir APK
      run:  curl --upload-file app/build/outputs/apk/debug/app-debug.apk https://transfer.sh/wallet-hunter.apk
