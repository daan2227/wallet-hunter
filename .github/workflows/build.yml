name: Build APK
on:
  push:
    branches: [ main, claude/** ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install NDK
      run: |
        echo "y" | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
          "ndk;25.1.8937393" "cmake;3.22.1"

    - name: Clone and configure secp256k1
      run: |
        cd app/src/main/cpp
        git clone --depth=1 https://github.com/bitcoin-core/secp256k1.git
        cd secp256k1
        echo "=== Checking precomputed files ==="
        ls src/precomputed_ecmult.c 2>/dev/null && echo "OK precomputed_ecmult.c" || echo "MISSING precomputed_ecmult.c"
        ls src/precomputed_ecmult_gen.c 2>/dev/null && echo "OK precomputed_ecmult_gen.c" || echo "MISSING precomputed_ecmult_gen.c"
        # Generar tablas si faltan
        if [ ! -f "src/precomputed_ecmult.c" ]; then
          echo "Generating precomputed tables..."
          sudo apt-get install -y gcc make 2>/dev/null || true
          gcc -o gen_precomputed_ecmult             src/gen_ecmult_static_pre_g.c             -I. -Isrc             -DSECP256K1_BUILD             -DUSE_FIELD_5x52             -DUSE_SCALAR_4x64 2>/dev/null || true
          ./gen_precomputed_ecmult > src/precomputed_ecmult.c 2>/dev/null || true
        fi

    - name: Generate Bip39Words.kt
      run: python3 scripts/gen_bip39.py

    - name: Create keystore for signing
      run: |
        keytool -genkeypair -v           -keystore app/debug.keystore           -alias androiddebugkey -keyalg RSA -keysize 2048           -validity 10000 -storepass android -keypass android           -dname "CN=Android Debug,O=Android,C=US"

    - name: Build Release APK
      run: |
        chmod +x gradlew
        ./gradlew assembleRelease

    # Esta rama publica bajo su propio tag. El tag "latest-build" pertenece a
    # playstore/seed-recovery; compartirlo hacía que cualquier build de esta
    # rama borrase y reemplazase aquel APK bajo la misma etiqueta de descarga.
    - name: Delete old release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release delete latest-build-full --yes 2>/dev/null || true
        git push --delete origin latest-build-full 2>/dev/null || true

    - name: Create Release with APK
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release create latest-build-full \
          app/build/outputs/apk/release/*.apk \
          --title "Full build (hunting) $(date +%Y-%m-%d)" \
          --notes "Auto-build from commit ${{ github.sha }}. Full app including hunting features — NOT the Play Store build." \
          --prerelease
