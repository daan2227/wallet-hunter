name: Build APK
on:
  push:
    branches: [ main, claude/** ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # NOTA sobre el gasto de minutos.
  #
  # Habia aqui un trabajo "tailscale-archive" aparte que cruzaba Go otra vez
  # sólo para fallar en rojo si se rompía. Se ha quitado: DUPLICABA la
  # compilación de tailscale.com —lo más caro de todo esto— en cada commit, y el
  # repositorio es privado, o sea con minutos contados. Se agotaron.
  #
  # Lo que aportaba se consigue más barato: el paso de abajo compila tsnet una
  # sola vez, y otro comprueba que libtsbridge.so acabó dentro del APK y avisa
  # si no. Se pierde el rojo inmediato; se gana poder seguir compilando.
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install NDK
      run: |
        echo "y" | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
          "ndk;25.1.8937393" "cmake;3.22.1"

    - name: Clone and configure secp256k1
      run: |
        cd app/src/main/cpp
        git clone --depth=1 https://github.com/bitcoin-core/secp256k1.git
        cd secp256k1
        echo "=== Checking precomputed files ==="
        ls src/precomputed_ecmult.c 2>/dev/null && echo "OK precomputed_ecmult.c" || echo "MISSING precomputed_ecmult.c"
        ls src/precomputed_ecmult_gen.c 2>/dev/null && echo "OK precomputed_ecmult_gen.c" || echo "MISSING precomputed_ecmult_gen.c"
        # Generar tablas si faltan
        if [ ! -f "src/precomputed_ecmult.c" ]; then
          echo "Generating precomputed tables..."
          sudo apt-get install -y gcc make 2>/dev/null || true
          gcc -o gen_precomputed_ecmult             src/gen_ecmult_static_pre_g.c             -I. -Isrc             -DSECP256K1_BUILD             -DUSE_FIELD_5x52             -DUSE_SCALAR_4x64 2>/dev/null || true
          ./gen_precomputed_ecmult > src/precomputed_ecmult.c 2>/dev/null || true
        fi

    - name: Generate Bip39Words.kt
      run: python3 scripts/gen_bip39.py

    # tsnet empotrado. Va con continue-on-error a PROPÓSITO: compilarlo mete la
    # cadena de Go, el árbol entero de tailscale.com y 14 MB, y nada de eso
    # puede ser motivo de que una app que funciona deje de construirse. Si esto
    # falla, CMake no encuentra libtailscale.so, compila sin ella, y TsNet
    # contesta que no está disponible.
    #
    # El trabajo tailscale-archive de arriba sí falla en rojo cuando la
    # compilación se rompe, que es donde queremos enterarnos.
    - uses: actions/setup-go@v5
      with:
        go-version: '1.25'
      continue-on-error: true

    # Sin esto, cada commit recompila el árbol entero de tailscale.com —con
    # gvisor dentro—, que son varios minutos. La clave lleva el commit fijado de
    # libtailscale: mientras no se cambie, el caché vale y la compilación baja a
    # menos de un minuto. Al cambiarlo, la clave cambia sola y se recompila.
    - uses: actions/cache@v4
      continue-on-error: true
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
        key: go-tsnet-${{ hashFiles('scripts/build-libtailscale.sh') }}
        restore-keys: go-tsnet-

    - name: Build embedded tsnet (optional)
      continue-on-error: true
      run: scripts/build-libtailscale.sh

    # Restaura el keystore real si el secret existe; si no, genera el de debug
    # para que la compilación siga funcionando (APK no publicable).
    - name: Restore signing keystore
      env:
        KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
      run: |
        if [ -n "$KEYSTORE_B64" ]; then
          echo "$KEYSTORE_B64" | base64 -d > app/release.keystore
          echo "Using release keystore from secrets."
        else
          echo "::warning::RELEASE_KEYSTORE_B64 not set — signing with the debug key."
          keytool -genkeypair -v -keystore app/debug.keystore \
            -alias androiddebugkey -keyalg RSA -keysize 2048 \
            -validity 10000 -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"
        fi

    - name: Build Release APK
      env:
        RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
        RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      run: |
        chmod +x gradlew
        ./gradlew assembleRelease

    # Que se vea si tsnet entró o no.
    #
    # El paso que lo compila lleva continue-on-error, así que puede fallar sin
    # teñir nada de rojo — y entonces el APK sale sin nodo empotrado y con la
    # misma pinta que uno bueno. Esto lo dice a la cara: warning en el resumen
    # del build en vez de un descubrimiento en el móvil media hora después.
    - name: ¿Lleva el APK el nodo empotrado?
      run: |
        APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
        if unzip -l "$APK" | grep -q 'lib/arm64-v8a/libtsbridge.so'; then
          echo "OK: libtsbridge.so está en el APK"
          unzip -l "$APK" | grep -E 'libtsbridge|libtailscale' || true
          # Que pida el NOMBRE y no una ruta.
          #
          # Estar dentro del APK no basta: si libtailscale.so se compiló sin
          # SONAME, libtsbridge.so anota como dependencia la ruta absoluta de
          # ESTE runner, y en el móvil sale "library ... not found" al cargarla.
          # El APK se construye igual de bien, así que sin esto no se sabe hasta
          # instalarlo. Pasó, y costó tres intentos verlo.
          rm -rf /tmp/apkchk && mkdir -p /tmp/apkchk
          unzip -q -o "$APK" 'lib/arm64-v8a/lib*.so' -d /tmp/apkchk
          RE=$(ls $ANDROID_SDK_ROOT/ndk/25.1.8937393/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf 2>/dev/null || echo readelf)
          NEED=$("$RE" -d /tmp/apkchk/lib/arm64-v8a/libtsbridge.so 2>/dev/null \
                 | grep -o 'NEEDED.*\[.*\]' | sed 's/.*\[\(.*\)\]/\1/' | tr '\n' ' ')
          echo "libtsbridge.so necesita: $NEED"
          case "$NEED" in
            */*) echo "::error::libtsbridge.so pide una RUTA y no un nombre: $NEED. \
        Falta el SONAME en libtailscale.so; en el móvil dará 'library not found'."
                 exit 1 ;;
            *libtailscale.so*) echo "OK: pide libtailscale.so por su nombre" ;;
            *) echo "::warning::libtsbridge.so no depende de libtailscale.so ($NEED)" ;;
          esac
        else
          echo "::warning::El APK NO lleva el nodo empotrado (libtsbridge.so). \
        La app funciona igual, pero 'Usar nodo propio' dirá que no está disponible."
        fi

    # Deja el desglose en el log del build, para no tener que descargar el APK
    # y abrirlo a mano cada vez que se quiera saber qué ocupa qué.
    - name: APK size breakdown
      run: |
        APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
        echo "APK: $(du -h "$APK" | cut -f1)"
        python3 - "$APK" <<'EOF'
        import zipfile, sys, collections
        z = zipfile.ZipFile(sys.argv[1])
        infos = z.infolist()
        total = sum(i.compress_size for i in infos)
        print("comprimido: %.2f MB en %d entradas\n" % (total/1048576, len(infos)))
        print("-- 10 mayores --")
        for i in sorted(infos, key=lambda x: -x.compress_size)[:10]:
            print("  %7.2f MB  %s" % (i.compress_size/1048576, i.filename))
        cat = collections.Counter()
        for i in infos:
            n = i.filename
            k = ('lib/ nativo' if n.startswith('lib/') else
                 'dex' if n.endswith('.dex') else
                 'resources.arsc' if n == 'resources.arsc' else
                 'res/' if n.startswith('res/') else
                 'assets/' if n.startswith('assets/') else 'otros')
            cat[k] += i.compress_size
        print("\n-- por categoria --")
        for k, v in cat.most_common():
            print("  %7.2f MB  %5.1f%%  %s" % (v/1048576, v*100/total, k))
        EOF

    # Cada rama publica bajo su propio tag.
    #
    # "latest-build" pertenece a playstore/seed-recovery. Y desde que main
    # recibió el merge de la rama full, ambas construían y publicaban bajo
    # "latest-build-full": dos ejecuciones borrando y recreando el mismo release
    # a la vez, que es como se perdió el APK de f4b2be0 —"a release with the same
    # tag name already exists"— aunque el build fuese correcto.
    - name: Publish APK
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        if [ "${{ github.ref_name }}" = "main" ]; then
          TAG=latest-build-main
          TITLE="Full build · main"
        else
          TAG=latest-build-full
          TITLE="Full build (hunting)"
        fi

        # Crear-o-actualizar en vez de borrar-y-crear: sin borrar el tag no hay
        # ventana en la que otra ejecución lo encuentre a medias, y reintentar
        # es inofensivo.
        gh release view "$TAG" >/dev/null 2>&1 || \
          gh release create "$TAG" \
            --title "$TITLE $(date +%Y-%m-%d)" \
            --notes "Auto-build from commit ${{ github.sha }} (${{ github.ref_name }}). Full app including hunting features — NOT the Play Store build." \
            --prerelease

        gh release edit "$TAG" \
          --title "$TITLE $(date +%Y-%m-%d)" \
          --notes "Auto-build from commit ${{ github.sha }} (${{ github.ref_name }}). Full app including hunting features — NOT the Play Store build."

        # --clobber reemplaza el APK anterior conservando el release y el tag.
        gh release upload "$TAG" app/build/outputs/apk/release/*.apk --clobber
