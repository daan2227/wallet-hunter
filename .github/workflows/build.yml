name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install NDK
      run: |
        echo "y" | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
          "ndk;25.1.8937393" "cmake;3.22.1"

    - name: Clone secp256k1
      run: |
        cd app/src/main/cpp
        git clone --depth=1 https://github.com/bitcoin-core/secp256k1.git

    - name: Generate Bip39Words.kt
      run: python3 scripts/gen_bip39.py

    - name: Build Release APK
      run: |
        chmod +x gradlew
        ./gradlew assembleRelease

    - name: Delete old release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release delete latest-build --yes 2>/dev/null || true
        git push --delete origin latest-build 2>/dev/null || true

    - name: Create Release with APK
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release create latest-build \
          app/build/outputs/apk/release/*.apk \
          --title "Latest Build $(date +%Y-%m-%d)" \
          --notes "Auto-build from commit ${{ github.sha }}" \
          --prerelease
