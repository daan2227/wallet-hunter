name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Install NDK
      run: |
        echo "y" | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
          "ndk;25.2.9519653" "cmake;3.22.1"
    - name: Clone secp256k1
      run: |
        cd app/src/main/cpp
        git clone --depth=1 https://github.com/bitcoin-core/secp256k1.git
    - name: Generate Bip39Words.kt multi-language
      run: |
        python3 << 'ENDPY'
        import urllib.request
        BASE = "https://raw.githubusercontent.com/trezor/python-mnemonic/master/src/mnemonic/wordlist"
        LANGS = {"EN":"english","ES":"spanish","FR":"french","JA":"japanese","KO":"korean","PT":"portuguese"}
        out = "app/src/main/java/com/hunter/btc/Bip39Words.kt"
        kt = "package com.hunter.btc

object Bip39Words {
"
        ok_langs = []
        for lang, fname in LANGS.items():
            try:
                data = urllib.request.urlopen(f"{BASE}/{fname}.txt", timeout=15).read().decode("utf-8")
                words = [w.strip() for w in data.split("\n") if w.strip() and not w.startswith("#")]
                chunks = [words[i:i+8] for i in range(0, len(words), 8)]
                kt += f"\n    val {lang} = arrayOf(\n"
                for chunk in chunks:
                    kt += "        " + ", ".join(f'"{w}"' for w in chunk) + ",\n"
                kt += "    )\n"
                ok_langs.append(lang)
                print(f"{lang}: {len(words)} words")
            except Exception as e:
                print(f"{lang}: FAILED {e}")
        kt += "\n    val WORDS get() = EN\n"
        kt += "\n    fun forLang(lang: String) = when(lang) {\n"
        for lang in ok_langs:
            kt += f'        "{lang}" -> {lang}\n'
        kt += "        else -> EN\n    }\n}\n"
        open(out, "w").write(kt)
        print("Bip39Words.kt written")
        ENDPY
    - name: Build APK
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: wallet-hunter-apk
        path: app/build/outputs/apk/debug/app-debug.apk
