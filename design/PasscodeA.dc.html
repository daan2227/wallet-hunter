<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap">
  <style>
    body { margin:0; background:#0A0A0A; font-family:'IBM Plex Sans', system-ui, sans-serif; }
    a { color:#00C896; } a:hover { color:#00E0A8; }
    .lbl { font-size:10px; letter-spacing:.09em; text-transform:uppercase; color:#6E6E6E; font-weight:500; }
    .mono { font-family:'JetBrains Mono', ui-monospace, monospace; font-variant-numeric:tabular-nums; }
    .key { display:flex; align-items:center; justify-content:center; height:62px; border:1px solid #1C1C1C; }
  </style>
</helmet>

<div style="width:390px; height:844px; background:#0A0A0A; color:#EDEDED; display:flex; flex-direction:column; overflow:hidden">

  <div style="flex-grow:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:0 32px">
    <div style="width:44px; height:44px; border:1.5px solid #00C896; border-radius:4px; display:flex; align-items:center; justify-content:center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#00C896" stroke-width="1.9" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="1.5"/><path d="M8 10V7a4 4 0 018 0v3"/></svg>
    </div>

    <div style="font-size:19px; font-weight:600; margin-top:26px; letter-spacing:-.01em">Introduce tu clave</div>
    <div style="font-size:12px; color:#6E6E6E; margin-top:7px">Seis dígitos</div>

    <!-- puntos -->
    <div style="display:flex; gap:12px; margin-top:34px">
      <sc-for list="{{dots}}" as="d" hint-placeholder-count="6">
        <div style="width:13px; height:13px; border-radius:50%; background:{{d.bg}}; border:1.5px solid {{d.bd}}"></div>
      </sc-for>
    </div>
  </div>

  <!-- teclado: rejilla de celdas con hueco de 1px, sin cápsulas -->
  <div style="padding:0 20px 28px">
    <div style="display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:1px; background:#1C1C1C; border:1px solid #1C1C1C">
      <sc-for list="{{keys}}" as="k" hint-placeholder-count="12">
        <div class="key" style="background:{{k.bg}}; border:none">
          <sc-if value="{{k.num}}" hint-placeholder-val="{{true}}">
            <span class="mono" style="font-size:22px; font-weight:400; color:#EDEDED">{{k.n}}</span>
          </sc-if>
          <sc-if value="{{k.bio}}" hint-placeholder-val="{{false}}">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#00C896" stroke-width="1.6" stroke-linecap="round"><path d="M12 4a8 8 0 00-8 8v3"/><path d="M12 4a8 8 0 018 8v6"/><path d="M8 12a4 4 0 018 0v6"/><path d="M12 12v8"/></svg>
          </sc-if>
          <sc-if value="{{k.del}}" hint-placeholder-val="{{false}}">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6E6E6E" stroke-width="1.7" stroke-linecap="round"><path d="M9 5h11a2 2 0 012 2v10a2 2 0 01-2 2H9l-6-7z"/><path d="M13 9l5 5M18 9l-5 5"/></svg>
          </sc-if>
        </div>
      </sc-for>
    </div>

    <div style="text-align:center; margin-top:22px">
      <span style="font-size:12px; color:#6E6E6E">La clave no sale del dispositivo</span>
    </div>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const filled = { bg:'#00C896', bd:'#00C896' };
    const empty  = { bg:'transparent', bd:'#2A2A2A' };
    const k = (n) => ({ n, num:true, bio:false, del:false, bg:'#101010' });
    return {
      dots: [filled, filled, filled, empty, empty, empty],
      keys: [
        k('1'), k('2'), k('3'),
        k('4'), k('5'), k('6'),
        k('7'), k('8'), k('9'),
        { n:'', num:false, bio:true,  del:false, bg:'#0D1512' },
        k('0'),
        { n:'', num:false, bio:false, del:true,  bg:'#101010' }
      ]
    };
  }
}
</script>
</body>
</html>
