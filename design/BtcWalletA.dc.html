<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap">
  <style>
    body { margin:0; background:#0A0A0A; font-family:'IBM Plex Sans', system-ui, sans-serif; }
    a { color:#00C896; } a:hover { color:#00E0A8; }
    .lbl { font-size:10px; letter-spacing:.09em; text-transform:uppercase; color:#6E6E6E; font-weight:500; }
    .mono { font-family:'JetBrains Mono', ui-monospace, monospace; font-variant-numeric:tabular-nums; }
    .rule { height:1px; background:#1C1C1C; }
  </style>
</helmet>

<div style="width:390px; height:844px; background:#0A0A0A; color:#EDEDED; display:flex; flex-direction:column; overflow:hidden">

  <div style="display:flex; align-items:center; gap:14px; padding:16px 20px 14px">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7A7A7A" stroke-width="2.2" stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg>
    <div class="mono" style="flex-grow:1; font-size:13px; font-weight:500">MAIN WALLET</div>
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#7A7A7A" stroke-width="2" stroke-linecap="round"><circle cx="5" cy="12" r="1.3" fill="#7A7A7A"/><circle cx="12" cy="12" r="1.3" fill="#7A7A7A"/><circle cx="19" cy="12" r="1.3" fill="#7A7A7A"/></svg>
  </div>

  <!-- pestañas: subrayado, no relleno -->
  <div style="display:flex; padding:0 20px">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="4">
      <div style="flex-grow:1; text-align:center; padding:11px 0; font-size:12px; font-weight:500; color:{{t.fg}}; box-shadow:inset 0 -2px 0 {{t.bar}}">{{t.n}}</div>
    </sc-for>
  </div>
  <div class="rule"></div>

  <!-- total -->
  <div style="padding:26px 20px 22px">
    <div class="lbl">Saldo total</div>
    <div style="display:flex; align-items:baseline; gap:8px; margin-top:10px">
      <div class="mono" style="font-size:36px; font-weight:700; line-height:1; letter-spacing:-.035em; color:#00C896">0.04128</div>
      <div class="mono" style="font-size:14px; color:#7A7A7A">BTC</div>
    </div>
    <div class="mono" style="font-size:12px; color:#7A7A7A; margin-top:9px">≈ 2 741,60 USD</div>
  </div>
  <div class="rule"></div>

  <div style="display:flex; align-items:center; padding:14px 20px">
    <div class="lbl" style="flex-grow:1">Direcciones</div>
    <div class="mono" style="font-size:10px; color:#00C896">8 · 2 con saldo</div>
  </div>
  <div class="rule"></div>

  <!-- filas de dirección: tipo, índice, saldo -->
  <sc-for list="{{addrs}}" as="a" hint-placeholder-count="6">
    <div>
      <div style="display:flex; align-items:center; gap:12px; padding:13px 20px">
        <div class="mono" style="width:56px; font-size:10px; color:{{a.tc}}">{{a.t}}</div>
        <div style="flex-grow:1; min-width:0">
          <div class="mono" style="font-size:11px; color:#A8A8A8; overflow:hidden; text-overflow:ellipsis; white-space:nowrap">{{a.addr}}</div>
        </div>
        <div class="mono" style="font-size:12px; color:{{a.bc}}; text-align:right">{{a.bal}}</div>
      </div>
      <div class="rule"></div>
    </div>
  </sc-for>

  <!-- hallazgo del escaneo HD -->
  <div style="display:flex; gap:11px; padding:14px 20px; background:#0C1714">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#00C896" stroke-width="1.9" stroke-linecap="round" style="flex-shrink:0; margin-top:1px"><circle cx="11" cy="11" r="7"/><path d="M16 16l5 5"/></svg>
    <div style="font-size:11px; color:#8FBFAE; line-height:1.55">Se encontraron 2 direcciones con fondos más allá del índice 0. Ya aparecen en Enviar.</div>
  </div>
  <div class="rule"></div>

  <div style="flex-grow:1"></div>

  <!-- acciones -->
  <div style="display:flex; gap:12px; padding:16px 20px 24px">
    <div style="flex-grow:1; display:flex; align-items:center; justify-content:center; gap:9px; height:50px; border:1px solid #1C1C1C">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#C8C8C8" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
      <span style="font-size:13px; color:#C8C8C8">Enviar</span>
    </div>
    <div style="flex-grow:1; display:flex; align-items:center; justify-content:center; gap:9px; height:50px; border:1px solid #00C896; background:#0C1714">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#00C896" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M6 13l6 6 6-6"/></svg>
      <span style="font-size:13px; color:#00C896">Recibir</span>
    </div>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dim = '#4A4A4A', lit = '#EDEDED';
    return {
      tabs: [
        { n:'Saldo',    fg:'#EDEDED', bar:'#00C896' },
        { n:'Historial',fg:'#6E6E6E', bar:'transparent' },
        { n:'Enviar',   fg:'#6E6E6E', bar:'transparent' },
        { n:'Recibir',  fg:'#6E6E6E', bar:'transparent' }
      ],
      addrs: [
        { t:'P2PKH 0',  tc:'#6E6E6E', addr:'17fXz5FcwgsckAqWdhLxFcaJziME78Hw6b', bal:'0.03900', bc:lit },
        { t:'P2PKH 3',  tc:'#00C896', addr:'1Ktr9nMqUBCagEsGnv2W3yYbcvdcjLYBcx', bal:'0.00228', bc:lit },
        { t:'P2SH 0',   tc:'#6E6E6E', addr:'37XJ2C834MhTkJq7WvDaYAN3CfHBUsk8VC', bal:'0.00000', bc:dim },
        { t:'WPKH 0',   tc:'#6E6E6E', addr:'bc1q74nn76xhy0cpzaqu5cnh3npdd4a6q5p50xlsuy', bal:'0.00000', bc:dim },
        { t:'WPKH 1',   tc:'#6E6E6E', addr:'bc1qndn5403x5nw5gfn74nlqwqkyel7er5w0q7r60g', bal:'0.00000', bc:dim },
        { t:'P2TR 0',   tc:'#6E6E6E', addr:'bc1pjfywu89zqup6092gy0ene70mpyjyyaftq7vceuq', bal:'0.00000', bc:dim }
      ]
    };
  }
}
</script>
</body>
</html>
