    const on  = { bg:'#00C896', fg:'#0E0E0E', w:'600' };
    return { types: [
      { n:'bc1q', ...on }, { n:'bc1p', ...off }, { n:'3...', ...off }, { n:'1...', ...off }
    ]};
  }
}
