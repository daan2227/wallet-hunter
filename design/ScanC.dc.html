<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;800&family=Space+Mono:wght@400;700&display=swap">
  <style>
    body { margin:0; background:#080808; font-family:'Archivo', system-ui, sans-serif; }
    a { color:#00C896; } a:hover { color:#00E0A8; }
    .m { font-family:'Space Mono', ui-monospace, monospace; font-variant-numeric:tabular-nums; }
    .tag { font-size:9px; font-weight:800; letter-spacing:.16em; text-transform:uppercase; color:#666; }
    .cell { border-right:1px solid #232323; border-bottom:1px solid #232323; padding:14px 16px; }
  </style>
</helmet>

<div style="width:390px; height:844px; background:#080808; color:#F5F5F5; display:flex; flex-direction:column; overflow:hidden">

  <!-- cabecera estructural -->
  <div style="display:flex; border-bottom:2px solid #00C896">
    <div style="flex-grow:1; padding:15px 16px">
      <div class="tag" style="color:#00C896">Wallet Hunter</div>
      <div style="font-size:19px; font-weight:800; letter-spacing:-.02em; margin-top:3px">ESCÁNER</div>
    </div>
    <div style="width:74px; border-left:1px solid #232323; display:flex; flex-direction:column; align-items:center; justify-content:center; background:#0D1512">
      <div class="m" style="font-size:9px; color:#00C896; letter-spacing:.1em">ACTIVO</div>
      <div class="m" style="font-size:13px; color:#00C896; margin-top:3px">00:51</div>
    </div>
    <div style="width:52px; border-left:1px solid #232323; display:flex; align-items:center; justify-content:center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#888" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </div>
  </div>

  <!-- lectura dominante -->
  <div style="padding:22px 16px 16px; border-bottom:1px solid #232323">
    <div class="tag">Velocidad actual</div>
    <div style="display:flex; align-items:flex-end; gap:10px; margin-top:6px">
      <div class="m" style="font-size:64px; font-weight:700; line-height:.82; letter-spacing:-.05em; color:#00C896">2.57</div>
      <div style="padding-bottom:6px">
        <div class="tag" style="color:#888">MKeys</div>
        <div class="tag" style="color:#444; margin-top:2px">por segundo</div>
      </div>
    </div>
    <!-- barras de historial -->
    <div style="display:flex; align-items:flex-end; gap:3px; height:38px; margin-top:18px">
      <div style="flex-grow:1; height:34%; background:#1E4A3C"></div>
      <div style="flex-grow:1; height:52%; background:#1E4A3C"></div>
      <div style="flex-grow:1; height:41%; background:#1E4A3C"></div>
      <div style="flex-grow:1; height:68%; background:#236554"></div>
      <div style="flex-grow:1; height:58%; background:#236554"></div>
      <div style="flex-grow:1; height:79%; background:#236554"></div>
      <div style="flex-grow:1; height:63%; background:#236554"></div>
      <div style="flex-grow:1; height:88%; background:#00C896"></div>
      <div style="flex-grow:1; height:72%; background:#00C896"></div>
      <div style="flex-grow:1; height:100%; background:#00C896"></div>
      <div style="flex-grow:1; height:84%; background:#00C896"></div>
      <div style="flex-grow:1; height:46%; background:#00C896"></div>
    </div>
    <div style="display:flex; justify-content:space-between; margin-top:8px">
      <div class="tag" style="color:#444">Pico 5.64</div>
      <div class="tag" style="color:#444">Media 3.01</div>
    </div>
  </div>

  <!-- rejilla de celdas -->
  <div style="display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); border-bottom:1px solid #232323">
    <div class="cell">
      <div class="tag">Claves</div>
      <div class="m" style="font-size:20px; font-weight:700; margin-top:6px; letter-spacing:-.03em">166,442,496</div>
    </div>
    <div class="cell" style="border-right:none">
      <div class="tag">Ritmo</div>
      <div class="m" style="font-size:20px; font-weight:700; margin-top:6px; letter-spacing:-.03em">221 G<span style="font-size:11px; color:#666">/día</span></div>
    </div>
    <div class="cell" style="border-bottom:none">
      <div class="tag">Dataset</div>
      <div class="m" style="font-size:20px; font-weight:700; margin-top:6px; letter-spacing:-.03em; color:#00C896">10.3 M</div>
    </div>
    <div class="cell" style="border-right:none; border-bottom:none">
      <div class="tag">Hallazgos</div>
      <div class="m" style="font-size:20px; font-weight:700; margin-top:6px; letter-spacing:-.03em; color:#444">0</div>
    </div>
  </div>

  <!-- selector de modo, como interruptor físico -->
  <div style="border-bottom:1px solid #232323">
    <div class="tag" style="padding:14px 16px 10px">Modo de escaneo</div>
    <div style="display:flex; padding:0 16px 16px; gap:0">
      <div style="flex-grow:1; border:1px solid #232323; padding:11px 14px; text-align:center">
        <div class="m" style="font-size:12px; color:#666">BIP39</div>
      </div>
      <div style="flex-grow:1; border:1px solid #00C896; background:#00C896; padding:11px 14px; text-align:center">
        <div class="m" style="font-size:12px; font-weight:700; color:#080808">RAW KEY</div>
      </div>
    </div>
  </div>

  <!-- ajustes -->
  <div style="display:flex; align-items:center; gap:12px; padding:15px 16px; border-bottom:1px solid #232323">
    <span class="tag" style="width:64px">Motor</span>
    <div class="m" style="flex-grow:1; font-size:12px; color:#C0C0C0">8 hilos · CPU 100%</div>
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#444" stroke-width="2.6"><path d="M9 6l6 6-6 6"/></svg>
  </div>
  <div style="display:flex; align-items:center; gap:12px; padding:15px 16px; border-bottom:1px solid #232323">
    <span class="tag" style="width:64px">Cluster</span>
    <div class="m" style="flex-grow:1; font-size:12px; color:#666">Sin dispositivos</div>
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#444" stroke-width="2.6"><path d="M9 6l6 6-6 6"/></svg>
  </div>

  <div style="flex-grow:1"></div>

  <!-- acción, ancho completo, sin radios -->
  <div style="display:flex; border-top:1px solid #232323">
    <div style="width:74px; background:#F04040; display:flex; align-items:center; justify-content:center">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="#080808"><rect x="6" y="6" width="12" height="12"/></svg>
    </div>
    <div style="flex-grow:1; height:60px; display:flex; align-items:center; padding-left:18px; background:#150A0A">
      <div>
        <div style="font-size:15px; font-weight:800; letter-spacing:.02em; color:#F04040">DETENER ESCANEO</div>
        <div class="tag" style="color:#7A4444; margin-top:2px">Se guardará el progreso</div>
      </div>
    </div>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {}
</script>
</body>
</html>
