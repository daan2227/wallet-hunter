<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap">
  <style>
    body { margin:0; background:#0A0A0A; font-family:'IBM Plex Sans', system-ui, sans-serif; }
    a { color:#00C896; } a:hover { color:#00E0A8; }
    .lbl { font-size:10px; letter-spacing:.09em; text-transform:uppercase; color:#6E6E6E; font-weight:500; }
    .mono { font-family:'JetBrains Mono', ui-monospace, monospace; font-variant-numeric:tabular-nums; }
    .rule { height:1px; background:#1C1C1C; }
  </style>
</helmet>

<div style="width:390px; height:844px; background:#0A0A0A; color:#EDEDED; display:flex; flex-direction:column; overflow:hidden">

  <div style="display:flex; align-items:center; gap:10px; padding:16px 20px 14px">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#00C896" stroke-width="1.9" stroke-linejoin="round"><path d="M10 3h4v3a2 2 0 104 0h3v4h-3a2 2 0 100 4h3v4h-4v-3a2 2 0 10-4 0v3H6v-4H3v-4h3a2 2 0 100-4H3V6h3V3h4z"/></svg>
    <div class="mono" style="flex-grow:1; font-size:13px; font-weight:500">PUZZLE</div>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7A7A7A" stroke-width="1.8" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
  </div>
  <div class="rule"></div>

  <!-- objetivo: lo primero es qué se busca y cuánto hay -->
  <div style="padding:22px 20px 18px">
    <div style="display:flex; align-items:baseline; gap:12px">
      <div class="mono" style="font-size:44px; font-weight:700; line-height:.9; letter-spacing:-.03em">#70</div>
      <div style="flex-grow:1"></div>
      <div style="text-align:right">
        <div class="lbl">Recompensa</div>
        <div class="mono" style="font-size:18px; color:#00C896; margin-top:4px">7.10185796</div>
      </div>
    </div>
    <div class="mono" style="font-size:10px; color:#5A5A5A; margin-top:14px; word-break:break-all">1L2GM8eE7mJWLdo3HZS6su1832NX2txaac</div>
  </div>
  <div class="rule"></div>

  <!-- selector, compacto -->
  <div style="padding:16px 20px">
    <div class="lbl" style="margin-bottom:10px">Seleccionar</div>
    <div style="display:flex; gap:6px">
      <sc-for list="{{chips}}" as="c" hint-placeholder-count="6">
        <div class="mono" style="flex-grow:1; text-align:center; padding:9px 0; font-size:11px; border:1px solid {{c.b}}; background:{{c.bg}}; color:{{c.fg}}">{{c.n}}</div>
      </sc-for>
    </div>
  </div>
  <div class="rule"></div>

  <!-- posición en el rango: lo que antes no se veía -->
  <div style="padding:18px 20px">
    <div style="display:flex; align-items:center">
      <div class="lbl" style="flex-grow:1">Posición en el rango</div>
      <div class="mono" style="font-size:12px; color:#00C896">45.41 %</div>
    </div>
    <div style="height:3px; background:#1C1C1C; margin-top:12px; position:relative">
      <div style="position:absolute; left:45.4%; top:-4px; width:2px; height:11px; background:#00C896"></div>
    </div>
    <div style="display:flex; justify-content:space-between; margin-top:9px">
      <div class="mono" style="font-size:9px; color:#4A4A4A">2000…0000</div>
      <div class="mono" style="font-size:9px; color:#4A4A4A">3fff…ffff</div>
    </div>
    <div class="mono" style="font-size:11px; color:#7A7A7A; margin-top:14px">Bloque 268,076,365,140</div>
  </div>
  <div class="rule"></div>

  <!-- lecturas -->
  <sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
    <div>
      <div style="display:flex; align-items:center; padding:13px 20px">
        <div class="lbl" style="flex-grow:1">{{r.k}}</div>
        <div class="mono" style="font-size:15px; color:{{r.c}}">{{r.v}}</div>
      </div>
      <div class="rule"></div>
    </div>
  </sc-for>

  <!-- acciones secundarias como texto, no como tarjetas -->
  <div style="display:flex; gap:26px; padding:18px 20px">
    <div style="display:flex; align-items:center; gap:8px">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#00C896" stroke-width="1.8" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.3" fill="#00C896"/><circle cx="15.5" cy="15.5" r="1.3" fill="#00C896"/><circle cx="15.5" cy="8.5" r="1.3" fill="#00C896"/><circle cx="8.5" cy="15.5" r="1.3" fill="#00C896"/></svg>
      <span style="font-size:12px; color:#00C896">Saltar al azar</span>
    </div>
    <div style="display:flex; align-items:center; gap:8px">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#7A7A7A" stroke-width="1.8" stroke-linecap="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
      <span style="font-size:12px; color:#7A7A7A">Reiniciar</span>
    </div>
  </div>
  <div class="rule"></div>

  <div style="display:flex; align-items:center; gap:12px; padding:14px 20px">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6E6E6E" stroke-width="1.8" stroke-linecap="round"><path d="M12 2v3M12 19v3M5 5l2 2M17 17l2 2M2 12h3M19 12h3"/><circle cx="12" cy="12" r="3"/></svg>
    <div style="flex-grow:1; font-size:13px; color:#C8C8C8">Potencia</div>
    <div class="mono" style="font-size:11px; color:#6E6E6E">Media · aleatorio · 4096</div>
  </div>
  <div class="rule"></div>

  <div style="flex-grow:1"></div>

  <div style="padding:16px 20px 24px">
    <div style="display:flex; align-items:center; justify-content:center; gap:10px; height:52px; border:1px solid #00C896; background:#0C1714">
      <svg width="13" height="13" viewBox="0 0 12 12" fill="#00C896"><path d="M2 1l8 5-8 5z"/></svg>
      <span class="mono" style="font-size:13px; font-weight:500; letter-spacing:.14em; color:#00C896">INICIAR</span>
    </div>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const off = { b:'#1C1C1C', bg:'transparent', fg:'#6E6E6E' };
    const on  = { b:'#00C896', bg:'#0C1714', fg:'#00C896' };
    return {
      chips: [
        { n:'#70', ...on }, { n:'#71', ...off }, { n:'#72', ...off },
        { n:'#73', ...off }, { n:'#74', ...off }, { n:'#75', ...off }
      ],
      rows: [
        { k:'Velocidad',      v:'6.34 M/s',   c:'#EDEDED' },
        { k:'Revisadas',      v:'100,304,000', c:'#EDEDED' },
        { k:'Sesión',         v:'00:00:23',   c:'#EDEDED' },
        { k:'Cobertura',      v:'0.0000 %',   c:'#7A7A7A' }
      ]
    };
  }
}
</script>
</body>
</html>
