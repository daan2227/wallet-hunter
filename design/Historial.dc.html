<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Public+Sans:wght@400;500;600&display=swap">
  <style>
    body { margin:0; background:#0E0E0E; font-family:'Public Sans', system-ui, sans-serif; }
    a { color:#00C896; } a:hover { color:#00E0A8; }
    .disp { font-family:'Sora', system-ui, sans-serif; font-variant-numeric:tabular-nums; }
    .cap { font-size:12px; color:#8A8A8A; font-weight:500; }
    .card { background:#161616; border-radius:14px; }
  </style>
</helmet>

<div style="width:390px; height:844px; background:#0E0E0E; color:#F2F2F2; display:flex; flex-direction:column; overflow:hidden">

  <div style="display:flex; align-items:center; gap:14px; padding:18px 22px 16px">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8A8A8A" stroke-width="2.2" stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg>
    <div style="flex-grow:1; font-family:'Sora'; font-size:17px; font-weight:600; letter-spacing:-.01em">Historial</div>
  </div>

  <!-- acumulado -->
  <div style="padding:6px 22px 24px">
    <div class="cap">Claves revisadas en total</div>
    <div class="disp" style="font-size:44px; font-weight:700; letter-spacing:-.04em; margin-top:8px">4,21<span style="font-size:19px; color:#8A8A8A; font-weight:400"> mil M</span></div>
    <div class="cap" style="margin-top:8px">37 sesiones · ningún hallazgo todavía</div>
  </div>

  <!-- actividad -->
  <div class="card" style="margin:0 22px 20px; padding:18px 20px">
    <div style="display:flex; align-items:baseline">
      <div style="flex-grow:1; font-size:14px; font-weight:500">Últimos 14 días</div>
      <div class="cap" style="font-size:11px">2 días sin buscar</div>
    </div>
    <div style="display:flex; align-items:flex-end; gap:5px; height:56px; margin-top:16px">
      <sc-for list="{{bars}}" as="b" hint-placeholder-count="14">
        <div style="flex-grow:1; height:{{b.h}}; background:{{b.c}}; border-radius:2px"></div>
      </sc-for>
    </div>
  </div>

  <!-- sesiones -->
  <div class="cap" style="padding:0 22px 10px">Sesiones</div>
  <div class="card" style="margin:0 22px">
    <sc-for list="{{sessions}}" as="s" hint-placeholder-count="5">
      <div>
        <div style="display:flex; align-items:center; gap:13px; padding:15px 17px">
          <div style="width:40px; height:40px; border-radius:11px; background:{{s.chip}}; display:flex; align-items:center; justify-content:center; flex-shrink:0">
            <span class="disp" style="font-size:9px; font-weight:600; color:{{s.chipFg}}">{{s.mode}}</span>
          </div>
          <div style="flex-grow:1; min-width:0">
            <div class="disp" style="font-size:14px; font-weight:600; letter-spacing:-.01em">{{s.keys}}</div>
            <div class="cap" style="font-size:11px; margin-top:3px">{{s.when}} · duró {{s.dur}}</div>
          </div>
          <div class="disp" style="font-size:13px; color:#8A8A8A">{{s.rate}}</div>
        </div>
        <div style="height:1px; background:{{s.sep}}; margin:0 17px"></div>
      </div>
    </sc-for>
  </div>

  <div style="flex-grow:1"></div>

  <div style="display:flex; gap:12px; padding:18px 22px 26px">
    <div style="flex-grow:1; height:50px; border-radius:14px; background:#1A1A1A; display:flex; align-items:center; justify-content:center; gap:9px">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#C8C8C8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M8 7l4-4 4 4"/><path d="M4 15v4a2 2 0 002 2h12a2 2 0 002-2v-4"/></svg>
      <span style="font-size:14px; font-weight:500; color:#C8C8C8">Exportar</span>
    </div>
    <div style="width:118px; height:50px; border-radius:14px; background:#1A1A1A; display:flex; align-items:center; justify-content:center; gap:9px">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8A8A8A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13"/></svg>
      <span style="font-size:14px; color:#8A8A8A">Vaciar</span>
    </div>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const hs = [22, 48, 31, 64, 12, 0, 0, 55, 73, 41, 88, 60, 34, 96];
    const dim = { chip:'#1E1E1E', chipFg:'#8A8A8A' };
    const grn = { chip:'rgba(0,200,150,.12)', chipFg:'#00C896' };
    const blu = { chip:'rgba(110,168,254,.12)', chipFg:'#6EA8FE' };
    return {
      bars: hs.map(h => ({ h: Math.max(h, 4) + '%', c: h === 0 ? '#232323' : (h > 70 ? '#00C896' : '#2A4A40') })),
      sessions: [
        { mode:'PUZZLE', ...grn, keys:'100,3 M claves', when:'Hoy 09:12',  dur:'23 s',    rate:'6,34 M/s', sep:'#222' },
        { mode:'RAW',    ...blu, keys:'166,4 M claves', when:'Hoy 08:40',  dur:'51 s',    rate:'2,57 M/s', sep:'#222' },
        { mode:'BIP39',  ...dim, keys:'39,3 M claves',  when:'Ayer 22:05', dur:'4 min',   rate:'1,84 M/s', sep:'#222' },
        { mode:'PUZZLE', ...grn, keys:'1 204 M claves', when:'Ayer 18:30', dur:'2 h 47',  rate:'5,12 M/s', sep:'#222' },
        { mode:'RAW',    ...blu, keys:'812,0 M claves', when:'13 sep',     dur:'1 h 04',  rate:'3,40 M/s', sep:'transparent' }
      ]
    };
  }
}
</script>
</body>
</html>
